<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>TERMINAL_v4.2 | Data Pelatihan</title>
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=Space+Grotesk:wght@400;600;700&amp;family=Geist:wght@400;500&amp;display=swap" rel="stylesheet"/>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {

              "primary-container": "#008092",
              "on-surface": "#131b2e",
              "on-primary-fixed-variant": "#004e5a",
              "secondary": "#b5005f",
              "on-tertiary-fixed": "#07006c",
              "secondary-fixed": "#ffd9e2",
              "secondary-container": "#e20078",
              "outline": "#6d797c",
              "surface-container": "#eaedff",
              "tertiary-container": "#6063ee",
              "error": "#ba1a1a",
              "surface": "#faf8ff",
              "surface-container-high": "#e2e7ff",
              "on-background": "#131b2e",
              "on-secondary-container": "#fffbff",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed": "#001f25",
              "on-surface-variant": "#3d494b",
              "primary": "#006574",
              "tertiary-fixed": "#e1e0ff",
              "background": "#faf8ff",
              "inverse-on-surface": "#eef0ff",
              "primary-fixed-dim": "#63d6ec",
              "secondary-fixed-dim": "#ffb1c7",
              "on-secondary-fixed-variant": "#8e0049",
              "on-primary": "#ffffff",
              "on-tertiary-fixed-variant": "#2f2ebe",
              "on-error-container": "#93000a",
              "surface-bright": "#faf8ff",
              "surface-tint": "#006877",
              "on-tertiary": "#ffffff",
              "on-primary-container": "#f8fdff",
              "error-container": "#ffdad6",
              "inverse-primary": "#63d6ec",
              "on-secondary": "#ffffff",
              "surface-container-highest": "#dae2fd",
              "tertiary": "#4648d4",
              "primary-fixed": "#a3eeff",
              "on-error": "#ffffff",
              "on-tertiary-container": "#fffbff",
              "tertiary-fixed-dim": "#c0c1ff",
              "surface-container-low": "#f2f3ff",
              "inverse-surface": "#283044",
              "surface-variant": "#dae2fd",
              "outline-variant": "#bcc9cc",
              "on-secondary-fixed": "#3e001d"
          },
          "borderRadius": {
              "DEFAULT": "0.125rem",
              "lg": "0.25rem",
              "xl": "0.5rem",
              "full": "0.75rem"
          },
          "spacing": {
              "margin": "32px",
              "gutter": "24px",
              "container-max": "1280px",
              "unit": "8px",
              "container-padding": "20px"
          },
          "fontFamily": {
              "headline-md": ["Space Grotesk"],
              "headline-lg-mobile": ["Space Grotesk"],
              "headline-lg": ["Space Grotesk"],
              "headline-xl": ["Space Grotesk"],
              "body-md": ["Geist"],
              "headline-xl-mobile": ["Space Grotesk"],
              "body-lg": ["Geist"],
              "label-md": ["JetBrains Mono"]
          },
          "fontSize": {
              "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
              "headline-lg-mobile": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
              "headline-lg": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
              "headline-xl": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
              "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
              "headline-xl-mobile": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
              "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
              "label-md": ["14px", {"lineHeight": "1.4", "letterSpacing": "0.05em", "fontWeight": "500"}]
          }
        }
      }
    }
  </script>

  <style>
    @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(1000%); }
    }
    @keyframes blink {
        50% { opacity: 0; }
    }
    @keyframes glitch-active {
        0% { clip-path: inset(0 0 0 0); }
        20% { clip-path: inset(10% -5px 20% 0); }
        40% { clip-path: inset(50% 0 10% -5px); }
        60% { clip-path: inset(20% 0 40% 5px); }
        80% { clip-path: inset(0 -5px 60% 0); }
        100% { clip-path: inset(0 0 0 0); }
    }

    .scanline-overlay {
        background: linear-gradient(to bottom, transparent, rgba(0, 155, 176, 0.03) 50%, transparent);
        animation: scanline 12s linear infinite;
    }

    .data-bracket-l::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 2px; height: 100%;
        background: #009bb0;
    }
    .data-bracket-l::after {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 8px; height: 2px;
        background: #009bb0;
    }
    .data-bracket-r::before {
        content: '';
        position: absolute;
        top: 0; right: 0; width: 2px; height: 100%;
        background: #009bb0;
    }
    .data-bracket-r::after {
        content: '';
        position: absolute;
        bottom: 0; right: 0; width: 8px; height: 2px;
        background: #009bb0;
    }

    .glitch-hover:active {
        animation: glitch-active 0.3s cubic-bezier(.25,.46,.45,.94) both;
    }

    .cursor-pulse {
        animation: blink 1s step-end infinite;
    }

    .fade-slide-up {
        animation: fadeSlideUp 0.6s ease-out forwards;
    }

    @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .grid-bg {
        background-size: 16px 16px;
        background-image: radial-gradient(circle, rgba(0, 155, 176, 0.05) 1px, transparent 1px);
    }
    body {
        min-height: max(884px, 100dvh);
    }
  </style>
</head>

<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container overflow-hidden h-screen flex flex-col font-body-md">

  <div class="fixed inset-0 z-0">
    <div class="absolute inset-0 grid-bg pointer-events-none"></div>
    <div class="absolute inset-0 scanline-overlay pointer-events-none"></div>
  </div>

  <header class="w-full sticky top-0 z-50 bg-surface/80 backdrop-blur-xl border-b border-outline-variant/30 flex items-center justify-between px-margin h-16 transition-all duration-300">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">security</span>
      <span class="font-headline-md text-headline-md tracking-tighter text-primary uppercase">TERMINAL_v4.2</span>
    </div>
    <div class="flex items-center gap-4">
      <span class="material-symbols-outlined text-on-surface-variant hover:bg-primary/5 p-2 rounded-full transition-colors active:scale-95 cursor-pointer">sensors</span>
    </div>
  </header>

  <main class="flex-1 relative z-10 flex items-center justify-center p-container-padding overflow-y-auto">
    <div class="fade-slide-up w-full max-w-sm relative my-8">
      
      <div class="absolute -top-4 -left-4 w-8 h-8 data-bracket-l"></div>
      <div class="absolute -bottom-4 -right-4 w-8 h-8 data-bracket-r"></div>
      
      <div class="bg-white/60 backdrop-blur-2xl border border-white/40 shadow-xl rounded-lg overflow-hidden relative">
        
        <div id="loader" class="absolute inset-0 bg-white/80 backdrop-blur-sm z-30 hidden flex-col items-center justify-center gap-3 transition-all duration-300">
          <div class="w-10 h-10 border-4 border-primary border-t-transparent rounded-full animate-spin"></div>
          <span class="font-label-md text-[11px] text-primary uppercase tracking-widest animate-pulse">Uplinking Data...</span>
        </div>

        <div class="bg-surface-container-high/40 h-8 flex items-center px-4 border-b border-black/5">
          <span class="font-label-md text-[10px] uppercase tracking-widest text-on-surface-variant/70">REF: 02-TRAIN-LOGX</span>
          <div class="ml-auto flex gap-1">
            <div id="status-dot" class="w-1.5 h-1.5 bg-primary rounded-full transition-colors duration-300"></div>
          </div>
        </div>

        <div class="p-8 space-y-6">
          <div class="text-center space-y-1">
            <h1 class="font-headline-lg text-headline-lg text-primary uppercase tracking-tight">Pelatihan Terminal</h1>
            <p class="font-label-md text-[10px] text-primary/70 tracking-[0.2em] uppercase">
              SYSTEM STATUS: <span id="sys-status" class="text-primary font-bold">READY_TO_TRANSMIT</span>
            </p>
          </div>

          <form class="space-y-5" onsubmit="event.preventDefault()">
            
            <div class="group relative">
              <label class="block font-label-md text-[11px] text-on-surface-variant mb-1 group-focus-within:text-primary transition-colors uppercase tracking-widest">NOMOR PENER</label>
              <div class="relative flex items-center">
                <input id="id" maxlength="8" class="w-full bg-transparent border-0 border-b-2 border-outline-variant py-2 focus:ring-0 focus:border-primary text-on-surface font-label-md placeholder:text-on-surface-variant/20 transition-all uppercase" placeholder="8 DIGIT ANGKA" type="text"/>
                <div class="absolute right-0 w-1 h-4 bg-primary cursor-pulse"></div>
              </div>
            </div>

            <div class="group relative">
              <label class="block font-label-md text-[11px] text-on-surface-variant mb-1 group-focus-within:text-primary transition-colors uppercase tracking-widest">NAMA KARYAWAN</label>
              <div class="relative flex items-center">
                <input id="nama" class="w-full bg-transparent border-0 border-b-2 border-outline-variant py-2 focus:ring-0 focus:border-primary text-on-surface font-label-md placeholder:text-on-surface-variant/20 transition-all uppercase" placeholder="INPUT FULL NAME" type="text"/>
              </div>
            </div>

            <div class="group relative">
              <label class="block font-label-md text-[11px] text-on-surface-variant mb-1 group-focus-within:text-primary transition-colors uppercase tracking-widest">JUDUL PELATIHAN</label>
              <div class="relative flex items-center">
                <input id="judul" class="w-full bg-transparent border-0 border-b-2 border-outline-variant py-2 focus:ring-0 focus:border-primary text-on-surface font-label-md placeholder:text-on-surface-variant/20 transition-all uppercase" placeholder="MODUL TRAINING" type="text"/>
              </div>
            </div>

            <div class="group relative">
              <label class="block font-label-md text-[11px] text-on-surface-variant mb-1 group-focus-within:text-primary transition-colors uppercase tracking-widest">TANGGAL</label>
              <div class="relative flex items-center">
                <input id="tanggal" class="w-full bg-transparent border-0 border-b-2 border-outline-variant py-2 focus:ring-0 focus:border-primary text-on-surface font-label-md transition-all" type="date"/>
              </div>
            </div>

            <div class="group relative">
              <label class="block font-label-md text-[11px] text-on-surface-variant mb-1 group-focus-within:text-primary transition-colors uppercase tracking-widest">JENIS KATEGORI</label>
              <div class="relative flex items-center">
                <select id="jenis" class="w-full bg-transparent border-0 border-b-2 border-outline-variant py-2 focus:ring-0 focus:border-primary text-on-surface font-label-md transition-all appearance-none">
                  <option class="bg-surface" value="">[ PILIH JENIS ]</option>
                  <option class="bg-surface">CORE</option>
                  <option class="bg-surface">SPESIFIC</option>
                  <option class="bg-surface">GENERIC</option>
                  <option class="bg-surface">SUPLEMENTARY</option>
                </select>
                <span class="material-symbols-outlined absolute right-0 pointer-events-none text-sm text-on-surface-variant">expand_more</span>
              </div>
            </div>

            <button onclick="simpan()" class="glitch-hover w-full bg-primary text-on-primary py-4 rounded-lg font-headline-md text-label-md font-bold tracking-widest active:scale-95 transition-all duration-200 shadow-md hover:shadow-lg hover:bg-primary/90 group mt-4">
              <div class="flex items-center justify-center gap-2">
                TRANSMIT DATA
                <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">bolt</span>
              </div>
            </button>
          </form>

          <div class="flex justify-between items-center font-label-md text-[9px] text-on-surface-variant/60 pt-4 border-t border-black/5">
            <div class="flex flex-col uppercase">
              <span>SYS_KERN: 4.2.0-TRAIN</span>
              <span>BUFFER_STAT: CLEAR</span>
            </div>
            <div class="text-right uppercase">
              <span>UPLINK_NODE</span>
              <span class="block text-primary font-bold">STABLE_CONNECTED</span>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <nav class="w-full z-50 h-20 bg-surface/80 backdrop-blur-xl border-t border-outline-variant/30 flex justify-around items-center px-margin pb-safe shrink-0">
    <div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:text-primary transition-colors duration-200 active:scale-90 cursor-pointer">
      <span class="material-symbols-outlined">grid_view</span>
    </div>
    <div class="flex flex-col items-center justify-center text-primary bg-primary/10 rounded-xl px-4 py-2 transition-all duration-200 active:scale-90 cursor-pointer">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">security</span>
    </div>
    <div class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:text-primary transition-colors duration-200 active:scale-90 cursor-pointer">
      <span class="material-symbols-outlined">terminal</span>
    </div>
  </nav>

  <div id="modal" class="fixed inset-0 z-[100] bg-black/50 backdrop-blur-md hidden items-center justify-center p-4 transition-all duration-300">
    <div class="bg-white/90 border-2 border-primary w-full max-w-xs rounded-lg p-6 shadow-2xl relative scale-95 transition-transform duration-300" id="modal-box">
      <div class="flex items-center gap-2 text-primary mb-3" id="modal-title-area">
        <span id="modal-icon" class="material-symbols-outlined font-bold">info</span>
        <span id="modal-header-text" class="font-headline-md text-sm uppercase tracking-wider">SYSTEM INFO</span>
      </div>
      <p id="modal-msg" class="font-body-md text-sm text-on-surface uppercase tracking-wide mb-6">Data pipeline initialized.</p>
      <button onclick="tutupModal()" id="modal-btn" class="w-full bg-primary text-on-primary py-2.5 rounded font-label-md text-xs font-bold tracking-widest uppercase transition-all active:scale-95">
        ACKNOWLEDGE
      </button>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx2camkQP8fOqOfr5EQsnwHg9tKXtzfb4VdZk9BTisNaB-A1qwUgjLIoOAyWThg1IN4/exec";
    
    const loader = document.getElementById("loader");
    const modal = document.getElementById("modal");
    const modalBox = document.getElementById("modal-box");
    const modalIcon = document.getElementById("modal-icon");
    const modalHeaderText = document.getElementById("modal-header-text");
    const modalMsg = document.getElementById("modal-msg");
    const modalBtn = document.getElementById("modal-btn");
    const sysStatus = document.getElementById("sys-status");
    const statusDot = document.getElementById("status-dot");

    // Standard Default Date Execution
    const resetTanggal = () => {
      document.getElementById("tanggal").value = new Date().toISOString().split('T')[0];
    };
    resetTanggal();

    // Micro-interactions Base
    document.addEventListener('mousemove', (e) => {
        const glow = document.querySelector('.scanline-overlay');
        const x = e.clientX / window.innerWidth;
        const y = e.clientY / window.innerHeight;
        glow.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, rgba(0, 155, 176, 0.04) 0%, transparent 60%)`;
    });

    // Cyber Notification Controller
    function tampilkanModal(pesan, isError = false) {
      modalMsg.innerText = pesan;
      
      if(isError) {
        modalBox.className = "bg-white/90 border-2 border-secondary w-full max-w-xs rounded-lg p-6 shadow-2xl scale-100";
        modalIcon.innerText = "warning";
        modalIcon.className = "material-symbols-outlined text-secondary font-bold";
        modalHeaderText.innerText = "CRITICAL ERROR";
        modalHeaderText.className = "font-headline-md text-sm uppercase tracking-wider text-secondary";
        modalBtn.className = "w-full bg-secondary text-on-secondary py-2.5 rounded font-label-md text-xs font-bold tracking-widest uppercase transition-all active:scale-95";
        sysStatus.innerText = "SYS_ABORTED";
        sysStatus.className = "text-secondary font-bold";
        statusDot.className = "w-1.5 h-1.5 bg-secondary rounded-full";
      } else {
        modalBox.className = "bg-white/90 border-2 border-primary w-full max-w-xs rounded-lg p-6 shadow-2xl scale-100";
        modalIcon.innerText = "check_circle";
        modalIcon.className = "material-symbols-outlined text-primary font-bold";
        modalHeaderText.innerText = "TRANSMIT SUCCESS";
        modalHeaderText.className = "font-headline-md text-sm uppercase tracking-wider text-primary";
        modalBtn.className = "w-full bg-primary text-on-primary py-2.5 rounded font-label-md text-xs font-bold tracking-widest uppercase transition-all active:scale-95";
        sysStatus.innerText = "TRANSMISSION_COMPLETE";
        sysStatus.className = "text-primary font-bold";
        statusDot.className = "w-1.5 h-1.5 bg-primary rounded-full";
      }
      
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function tutupModal() {
      modal.classList.remove("flex");
      modal.classList.add("hidden");
    }

    // Comprehensive Reset Action
    function resetForm() {
      document.getElementById("id").value = "";
      document.getElementById("nama").value = "";
      document.getElementById("judul").value = "";
      document.getElementById("jenis").value = "";
      resetTanggal();
    }

    // Core Post Pipeline
    async function simpan() {
      const id = document.getElementById("id").value.trim();
      const nama = document.getElementById("nama").value.trim();
      const judul = document.getElementById("judul").value.trim();
      const tanggal = document.getElementById("tanggal").value;
      const jenis = document.getElementById("jenis").value;

      // Validation Guards
      if(!/^\d{8}$/.test(id)){
        tampilkanModal("ERROR: Nomor Pener wajib 8 digit angka.", true);
        return;
      }
      if(!nama){
        tampilkanModal("ERROR: Field NAMA tidak boleh kosong.", true);
        return;
      }
      if(!judul){
        tampilkanModal("ERROR: Field JUDUL tidak boleh kosong.", true);
        return;
      }
      if(!jenis){
        tampilkanModal("ERROR: Harap pilih KATEGORI pelatihan.", true);
        return;
      }

      // Activate Loader
      loader.classList.remove("hidden");
      loader.classList.add("flex");
      sysStatus.innerText = "UPLINKING_TO_SERVER";
      sysStatus.className = "text-primary font-bold animate-pulse";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({ id, nama, judul, tanggal, jenis })
        });

        const hasil = await res.json();

        // Deactivate Loader
        loader.classList.remove("flex");
        loader.classList.add("hidden");
        
        // Render Output & Fire Reset
        tampilkanModal(hasil.message || "Data berhasil disinkronisasi ke server.", false);
        resetForm();

      } catch (error) {
        loader.classList.remove("flex");
        loader.classList.add("hidden");
        tampilkanModal("TRANSMISSION FAILED: Terjadi masalah koneksi atau server.", true);
      }
    }

    // Progressive Web App (PWA) Register
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("sw.js").catch(err => {
        console.warn("Service worker gagal didaftarkan:", err);
      });
    }
  </script>
</body>
</html>
