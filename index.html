<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#006574;--primary-dark:#004e5a;--primary-light:#a3eeff;
  --secondary:#b5005f;--surface:#faf8ff;--surface-var:#dae2fd;
  --on-surface:#131b2e;--on-surface-var:#3d494b;--outline:#bcc9cc;
  --error:#ba1a1a;--white:#fff;
}
body{font-family:'JetBrains Mono',monospace;background:var(--surface);color:var(--on-surface);min-height:100dvh;display:flex;flex-direction:column}
.grid-bg{position:fixed;inset:0;background-image:radial-gradient(circle,rgba(0,155,176,.04) 1px,transparent 1px);background-size:16px 16px;pointer-events:none;z-index:0}
header{position:sticky;top:0;z-index:50;background:rgba(250,248,255,.85);backdrop-filter:blur(16px);border-bottom:1px solid rgba(188,201,204,.3);display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:56px}
.logo{display:flex;align-items:center;gap:8px;color:var(--primary);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:-.03em;text-transform:uppercase}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;z-index:1}
.card{background:rgba(255,255,255,.7);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.5);border-radius:12px;width:100%;max-width:360px;overflow:hidden;box-shadow:0 4px 24px rgba(0,101,116,.08);position:relative}
.card-header{background:rgba(226,231,255,.4);height:32px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid rgba(0,0,0,.06);justify-content:space-between}
.card-header span{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--on-surface-var);opacity:.7}
.dot{width:6px;height:6px;border-radius:50%;background:var(--primary);transition:background .3s}
.card-body{padding:28px 28px 24px}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:-.02em;text-align:center;margin-bottom:4px}
.card-sub{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--primary);opacity:.7;text-align:center;margin-bottom:24px}
.sys-status{font-weight:700}
.field{margin-bottom:16px}
label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--on-surface-var);margin-bottom:6px;transition:color .2s}
.field:focus-within label{color:var(--primary)}
.input-wrap{position:relative;display:flex;align-items:center}
input,select{width:100%;background:transparent;border:none;border-bottom:2px solid var(--outline);padding:8px 0;color:var(--on-surface);font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;outline:none;transition:border-color .2s;text-transform:uppercase;-webkit-appearance:none}
input::placeholder{color:rgba(61,73,75,.25);font-weight:400}
input:focus,select:focus{border-bottom-color:var(--primary)}
select{cursor:pointer}
.select-arrow{position:absolute;right:0;pointer-events:none;font-size:18px;color:var(--on-surface-var)}
.cursor{position:absolute;right:0;width:2px;height:14px;background:var(--primary);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:14px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,transform .1s;margin-top:8px}
.btn:hover{background:var(--primary-dark)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.footer-bar{display:flex;justify-content:space-between;font-size:9px;text-transform:uppercase;color:rgba(61,73,75,.5);padding-top:16px;border-top:1px solid rgba(0,0,0,.06);margin-top:8px;letter-spacing:.05em}
.footer-bar .right{text-align:right}
.footer-bar .stable{color:var(--primary);font-weight:700}
nav{position:sticky;bottom:0;z-index:50;background:rgba(250,248,255,.85);backdrop-filter:blur(16px);border-top:1px solid rgba(188,201,204,.3);display:flex;justify-content:space-around;align-items:center;padding:8px 24px 16px}
.nav-item{display:flex;flex-direction:column;align-items:center;padding:8px 16px;border-radius:10px;cursor:pointer;transition:all .15s;color:var(--on-surface-var)}
.nav-item.active{color:var(--primary);background:rgba(0,101,116,.08)}
.nav-item .material-symbols-outlined{font-size:22px}

/* LOADER */
.loader-overlay{position:absolute;inset:0;background:rgba(255,255,255,.85);backdrop-filter:blur(8px);z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;border-radius:12px}
.loader-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid rgba(0,101,116,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--primary);animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.show{display:flex}
.modal-box{background:rgba(255,255,255,.95);border:2px solid var(--primary);border-radius:12px;padding:24px;width:100%;max-width:300px;transform:scale(1);transition:transform .2s}
.modal-box.error{border-color:var(--secondary)}
.modal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.modal-icon{font-size:22px;color:var(--primary)}
.modal-icon.error{color:var(--secondary)}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--primary)}
.modal-title.error{color:var(--secondary)}
.modal-msg{font-size:12px;color:var(--on-surface);text-transform:uppercase;letter-spacing:.05em;line-height:1.6;margin-bottom:20px}
.modal-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:6px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:background .15s,transform .1s}
.modal-btn:active{transform:scale(.98)}
.modal-btn.error{background:var(--secondary)}

.fade-in{animation:fadeIn .4s ease-out}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="grid-bg"></div>

<header>
  <div class="logo">
    <span class="material-symbols-outlined" style="font-size:20px">security</span>
    TERMINAL_v4.2
  </div>
  <span class="material-symbols-outlined" style="color:var(--on-surface-var);font-size:22px;cursor:pointer">sensors</span>
</header>

<main>
  <div class="card fade-in">

    <div class="loader-overlay" id="loader">
      <div class="spinner"></div>
      <span class="loader-text">Uplinking data...</span>
    </div>

    <div class="card-header">
      <span>REF: 02-TRAIN-LOGX</span>
      <div class="dot" id="status-dot"></div>
    </div>

    <div class="card-body">
      <div class="card-title">Pelatihan Terminal</div>
      <div class="card-sub">SYSTEM STATUS: <span class="sys-status" id="sys-status">READY_TO_TRANSMIT</span></div>

      <div class="field">
        <label>Nomor Pener</label>
        <div class="input-wrap">
          <input id="id" maxlength="8" placeholder="8 DIGIT ANGKA" type="text" inputmode="numeric"/>
          <div class="cursor"></div>
        </div>
      </div>

      <div class="field">
        <label>Nama Karyawan</label>
        <div class="input-wrap">
          <input id="nama" placeholder="INPUT FULL NAME" type="text"/>
        </div>
      </div>

      <div class="field">
        <label>Judul Pelatihan</label>
        <div class="input-wrap">
          <input id="judul" placeholder="MODUL TRAINING" type="text"/>
        </div>
      </div>

      <div class="field">
        <label>Tanggal</label>
        <div class="input-wrap">
          <input id="tanggal" type="date"/>
        </div>
      </div>

      <div class="field">
        <label>Jenis Kategori</label>
        <div class="input-wrap">
          <select id="jenis">
            <option value="">[ PILIH JENIS ]</option>
            <option>CORE</option>
            <option>SPESIFIC</option>
            <option>GENERIC</option>
            <option>SUPLEMENTARY</option>
          </select>
          <span class="material-symbols-outlined select-arrow">expand_more</span>
        </div>
      </div>

      <button class="btn" id="submit-btn" onclick="simpan()">
        TRANSMIT DATA
        <span class="material-symbols-outlined" style="font-size:18px">bolt</span>
      </button>

      <div class="footer-bar">
        <div>
          <div>SYS_KERN: 4.2.0-TRAIN</div>
          <div>BUFFER_STAT: CLEAR</div>
        </div>
        <div class="right">
          <div>UPLINK_NODE</div>
          <div class="stable">STABLE_CONNECTED</div>
        </div>
      </div>
    </div>
  </div>
</main>

<nav>
  <div class="nav-item">
    <span class="material-symbols-outlined">grid_view</span>
  </div>
  <div class="nav-item active">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">security</span>
  </div>
  <div class="nav-item">
    <span class="material-symbols-outlined">terminal</span>
  </div>
</nav>

<div class="modal-backdrop" id="modal">
  <div class="modal-box" id="modal-box">
    <div class="modal-head">
      <span class="material-symbols-outlined modal-icon" id="modal-icon">info</span>
      <span class="modal-title" id="modal-title">SYSTEM INFO</span>
    </div>
    <p class="modal-msg" id="modal-msg">Data pipeline initialized.</p>
    <button class="modal-btn" id="modal-btn" onclick="tutupModal()">ACKNOWLEDGE</button>
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbx2camkQP8fOqOfr5EQsnwHg9tKXtzfb4VdZk9BTisNaB-A1qwUgjLIoOAyWThg1IN4/exec";

const $ = id => document.getElementById(id);
const loader = $("loader");
const modal = $("modal");
const sysStatus = $("sys-status");
const statusDot = $("status-dot");
const submitBtn = $("submit-btn");

document.getElementById("tanggal").value = new Date().toISOString().split("T")[0];

function showLoader(show) {
  loader.classList.toggle("show", show);
  submitBtn.disabled = show;
}

function showModal(msg, isError = false) {
  $("modal-msg").textContent = msg;
  const box = $("modal-box");
  const icon = $("modal-icon");
  const title = $("modal-title");
  const btn = $("modal-btn");
  if (isError) {
    box.className = "modal-box error";
    icon.textContent = "warning";
    icon.className = "material-symbols-outlined modal-icon error";
    title.textContent = "CRITICAL ERROR";
    title.className = "modal-title error";
    btn.className = "modal-btn error";
    sysStatus.textContent = "SYS_ABORTED";
    sysStatus.style.color = "var(--secondary)";
    statusDot.style.background = "var(--secondary)";
  } else {
    box.className = "modal-box";
    icon.textContent = "check_circle";
    icon.className = "material-symbols-outlined modal-icon";
    title.textContent = "TRANSMIT SUCCESS";
    title.className = "modal-title";
    btn.className = "modal-btn";
    sysStatus.textContent = "TRANSMISSION_COMPLETE";
    sysStatus.style.color = "var(--primary)";
    statusDot.style.background = "var(--primary)";
  }
  modal.classList.add("show");
}

function tutupModal() {
  modal.classList.remove("show");
  sysStatus.textContent = "READY_TO_TRANSMIT";
  sysStatus.style.color = "";
  statusDot.style.background = "var(--primary)";
}

function resetForm() {
  ["id","nama","judul","jenis"].forEach(id => $(id).value = "");
  document.getElementById("tanggal").value = new Date().toISOString().split("T")[0];
}

async function simpan() {
  const id = $("id").value.trim();
  const nama = $("nama").value.trim();
  const judul = $("judul").value.trim();
  const tanggal = $("tanggal").value;
  const jenis = $("jenis").value;

  if (!/^\d{8}$/.test(id)) { showModal("ERROR: Nomor Pener wajib 8 digit angka.", true); return; }
  if (!nama) { showModal("ERROR: Field NAMA tidak boleh kosong.", true); return; }
  if (!judul) { showModal("ERROR: Field JUDUL tidak boleh kosong.", true); return; }
  if (!jenis) { showModal("ERROR: Harap pilih KATEGORI pelatihan.", true); return; }

  showLoader(true);
  sysStatus.textContent = "UPLINKING_TO_SERVER";

  try {
    const res = await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id, nama, judul, tanggal, jenis })
    });

    showLoader(false);
    showModal("Data berhasil disinkronisasi ke server.", false);
    resetForm();
  } catch (err) {
    showLoader(false);
    showModal("TRANSMISSION FAILED: Cek koneksi internet atau hubungi admin.", true);
  }
}

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
